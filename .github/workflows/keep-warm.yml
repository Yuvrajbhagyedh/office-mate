name: Keep backend awake

# Render's free plan sleeps after ~15 minutes idle, and the first request then
# takes 30+ seconds. Pinging /health every 10 minutes keeps it awake.
# Note: GitHub pauses scheduled workflows in repos with no activity for 60 days.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://office-mate.onrender.com' }}
        run: curl -fsS --max-time 90 "$BACKEND_URL/health"
